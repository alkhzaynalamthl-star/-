<!doctype html>
<html lang="ar" dir="rtl" data-img-base="../assets/img/renders/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 3 · Bayt — Optimum Closets</title>
<meta name="description" content="Design concept 3: a warm, contemporary store with compact cards and fast browsing.">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="bayt.css">
</head>
<body>
<a class="skip" href="#main">Skip</a>
<div class="util">
	<div class="wrap util-in">
		<span class="demo" data-t="demo"></span>
		<ul class="facts">
			<li data-t="consultFree"></li>
			<li data-t="twoCities"></li>
		</ul>
	</div>
</div>
<header class="hdr">
	<div class="wrap hdr-in">
		<a class="logo" href="#top"><span class="logo-mark" aria-hidden="true"></span><span><span class="logo-ar">الخزائن الأمثل</span><span class="logo-en">Optimum Closets</span></span></a>
		<form class="search" role="search" onsubmit="return false">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
			<input type="search" id="q" data-t-attr="placeholder:searchPh" autocomplete="off">
			<label for="q" class="sr" data-t="search"></label>
		</form>
		<div class="hdr-actions">
			<button class="lang" type="button" data-lang-toggle><span data-t="lang"></span></button>
			<a class="ico hide-sm" href="#account" data-t-attr="aria-label:account"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></a>
			<a class="ico cart" href="#cart" data-t-attr="aria-label:cart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="cart-n" id="cart-n">0</span></a>
		</div>
	</div>
	<nav class="chips-bar" aria-label="Categories">
		<div class="wrap chips" id="chips"></div>
	</nav>
</header>

<main id="main">
	<section class="wrap hero" id="top">
		<div class="hero-copy">
			<p class="badge" data-t="heroBadge"></p>
			<h1 data-t="heroTitle"></h1>
			<p class="lede" data-t="heroText"></p>
			<div class="ctas">
				<a class="btn btn-main" href="#grid" data-t="shop"></a>
				<a class="btn btn-soft" href="#bespoke" data-t="bespoke"></a>
			</div>
			<ul class="trust">
				<li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg><span data-t="consultFree"></span></li>
				<li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-t="leadShort"></span></li>
			</ul>
		</div>
		<div class="hero-media" id="hero-media"></div>
	</section>

	<section class="wrap tiles" aria-labelledby="tiles-h">
		<h2 id="tiles-h" class="h2" data-t="categories"></h2>
		<div class="tile-row" id="tiles"></div>
	</section>

	<section class="wrap shop" id="grid" aria-labelledby="grid-h">
		<div class="shop-head">
			<h2 id="grid-h" class="h2" data-t="featured"></h2>
			<span class="tag" data-t="cardPreview"></span>
			<label class="sort"><span data-t="sortBy"></span>
				<select id="sort">
					<option value="pop" data-t="sortPop"></option>
					<option value="low" data-t="sortLow"></option>
					<option value="high" data-t="sortHigh"></option>
				</select>
			</label>
		</div>
		<p class="count" id="count" aria-live="polite"></p>
		<div class="grid" id="products"></div>
	</section>

	<section class="wrap local" aria-labelledby="local-h">
		<div class="local-media" id="local-media"></div>
		<div class="local-copy">
			<p class="badge" data-t="localBadge"></p>
			<h2 id="local-h" class="h2" data-t="localTitle"></h2>
			<ul class="ticks">
				<li data-t="local1"></li>
				<li data-t="local2"></li>
				<li data-t="local3"></li>
			</ul>
		</div>
	</section>

	<section class="wrap steps-sec" aria-labelledby="steps-h">
		<h2 id="steps-h" class="h2" data-t="process"></h2>
		<ol class="steps" id="steps"></ol>
	</section>

	<section class="wrap bespoke" id="bespoke">
		<div class="bespoke-in">
			<div>
				<h2 class="h2" data-t="bespoke"></h2>
				<p data-t="bespokeText"></p>
			</div>
			<form class="mini-form" onsubmit="return false">
				<label><span data-t="width"></span><input inputmode="numeric" placeholder="320"><em data-t="cm"></em></label>
				<label><span data-t="height"></span><input inputmode="numeric" placeholder="270"><em data-t="cm"></em></label>
				<button class="btn btn-main" type="button" data-t="next"></button>
			</form>
		</div>
	</section>

	<section class="wrap show" id="showrooms" aria-labelledby="show-h">
		<h2 id="show-h" class="h2" data-t="showrooms"></h2>
		<div class="show-grid" id="show"></div>
	</section>
</main>

<footer class="ftr">
	<div class="wrap ftr-in">
		<div><strong class="logo-ar">الخزائن الأمثل</strong><p id="ftr-contact"></p></div>
		<p>© 2026 · <span data-t="footerNote"></span></p>
	</div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/img/renders/images.js"></script>
<script src="shared/data.js"></script>
<script>
Object.assign( OC_DATA.strings, {
	searchPh: { ar: 'ابحث: خزانة زجاجية، أبواب منزلقة…', en: 'Search: glass wardrobe, sliding doors…' },
	heroBadge: { ar: 'جديد: خزانة نور الزجاجية', en: 'New: the Noor glass wardrobe' },
	leadShort: { ar: 'تركيب خلال 2–4 أسابيع من الاعتماد', en: 'Installed 2–4 weeks after approval' },
	all: { ar: 'الكل', en: 'All' },
	sortBy: { ar: 'ترتيب', en: 'Sort' },
	sortPop: { ar: 'الأكثر طلبًا', en: 'Most popular' },
	sortLow: { ar: 'السعر: من الأقل', en: 'Price: low to high' },
	sortHigh: { ar: 'السعر: من الأعلى', en: 'Price: high to low' },
	results: { ar: 'منتجات', en: 'products' },
	options: { ar: 'الخيارات', en: 'Options' },
	added: { ar: 'تمت الإضافة إلى السلة (معاينة)', en: 'Added to cart (preview)' },
	localBadge: { ar: 'مصمّمة لبيوتنا', en: 'Made for Saudi homes' },
	localTitle: { ar: 'تفاصيل تفهم طريقة لبسك', en: 'Details that understand how you dress' },
	local1: { ar: 'علّاقات طويلة تتسع للثياب والعبايات دون أن تنثني.', en: 'Long-hanging bays that fit thobes and abayas without folding.' },
	local2: { ar: 'أدراج للشماغ والغتر والإكسسوارات بتقسيمات مخملية.', en: 'Drawers with velvet dividers for shemaghs, ghutras and accessories.' },
	local3: { ar: 'أبواب منزلقة للغرف الضيقة، وزجاج مع إضاءة للغرف الواسعة.', en: 'Sliding doors for compact rooms; lit glass for generous ones.' },
	bespokeText: { ar: 'ابدأ بمقاسين فقط، ونكمل معك التفاصيل والصور في الخطوة التالية.', en: 'Start with just two measurements; we’ll collect details and photos in the next step.' },
	width: { ar: 'العرض', en: 'Width' },
	height: { ar: 'الارتفاع', en: 'Height' },
	next: { ar: 'متابعة', en: 'Continue' }
} );
</script>
<script src="shared/core.js"></script>
<script src="bayt.js"></script>
</body>
</html>
